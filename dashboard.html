<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; background: #0a0a0a; font-family: 'DM Sans', sans-serif; color: #e8e4de; }

    /* Login */
    #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .login-box { width: 100%; max-width: 340px; background: #111; border: 0.5px solid #222; border-radius: 16px; padding: 32px 28px; }
    .login-title { font-family: 'DM Mono', monospace; font-size: 11px; color: #444; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 24px; }
    .field-label { font-family: 'DM Mono', monospace; font-size: 10px; color: #444; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
    input[type="password"], input[type="text"], input[type="url"], textarea {
      width: 100%; background: #161616; border: 0.5px solid #222; border-radius: 8px;
      color: #ccc; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 300;
      padding: 10px 12px; outline: none; transition: border-color 0.15s;
    }
    input:focus, textarea:focus { border-color: #444; }
    textarea { resize: vertical; min-height: 70px; line-height: 1.6; }
    .btn {
      width: 100%; padding: 10px 14px; background: #1a1a1a; border: 0.5px solid #2a2a2a;
      border-radius: 8px; color: #999; font-family: 'DM Sans', sans-serif; font-size: 13px;
      font-weight: 400; cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s; margin-top: 16px;
    }
    .btn:hover { background: #222; color: #ccc; border-color: #333; }
    .btn-primary { background: #e8e4de; border-color: #e8e4de; color: #111; }
    .btn-primary:hover { background: #fff; border-color: #fff; color: #111; }
    .error-msg { font-family: 'DM Mono', monospace; font-size: 11px; color: #7a3a3a; margin-top: 10px; display: none; }

    /* Dashboard */
    #dashboard-screen { display: none; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 28px; border-bottom: 0.5px solid #1a1a1a;
      position: sticky; top: 0; background: #0a0a0a; z-index: 100;
    }
    .topbar-title { font-family: 'DM Mono', monospace; font-size: 11px; color: #444; letter-spacing: 0.1em; text-transform: uppercase; }
    .topbar-actions { display: flex; gap: 8px; align-items: center; }
    .btn-sm {
      padding: 7px 14px; background: #1a1a1a; border: 0.5px solid #2a2a2a;
      border-radius: 8px; color: #777; font-family: 'DM Mono', monospace; font-size: 10px;
      letter-spacing: 0.05em; cursor: pointer; transition: all 0.15s;
      text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-sm:hover { color: #ccc; border-color: #444; background: #222; }
    .btn-save { background: #e8e4de; border-color: #e8e4de; color: #111; }
    .btn-save:hover { background: #fff; border-color: #fff; color: #111; }
    .save-flash { font-family: 'DM Mono', monospace; font-size: 10px; color: #3a5a3a; opacity: 0; transition: opacity 0.3s; }
    .save-flash.show { opacity: 1; }
    .dashboard-body { max-width: 680px; margin: 0 auto; padding: 32px 28px 80px; }
    .section { margin-bottom: 36px; }
    .section-title { font-family: 'DM Mono', monospace; font-size: 10px; color: #444; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 0.5px solid #1a1a1a; }
    .field { margin-bottom: 14px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .avatar-row { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
    .avatar-preview {
      width: 56px; height: 56px; border-radius: 50%; background: #1e1e1e;
      border: 0.5px solid #2a2a2a; overflow: hidden; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'DM Mono', monospace; font-size: 18px; color: #555;
    }
    .avatar-preview img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .upload-btn {
      padding: 8px 14px; background: #161616; border: 0.5px dashed #2a2a2a;
      border-radius: 8px; color: #555; font-size: 12px; font-family: 'DM Sans', sans-serif;
      cursor: pointer; transition: all 0.15s;
    }
    .upload-btn:hover { border-color: #444; color: #888; }
    .links-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .link-row {
      display: flex; align-items: center; gap: 8px;
      background: #161616; border: 0.5px solid #1e1e1e;
      border-radius: 8px; padding: 8px 10px;
    }
    .link-row input { background: transparent; border: none; padding: 2px 4px; font-size: 12px; margin: 0; }
    .link-row input:focus { border-color: transparent; }
    .link-row .inp-label { flex: 1; color: #aaa; }
    .link-row .inp-url { flex: 2; color: #666; }
    .link-drag { color: #333; cursor: grab; font-size: 14px; flex-shrink: 0; padding: 0 2px; }
    .link-del { background: transparent; border: none; color: #333; cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px; transition: color 0.15s; flex-shrink: 0; }
    .link-del:hover { color: #888; }
    .add-link-btn {
      width: 100%; padding: 9px 12px; background: transparent; border: 0.5px dashed #222;
      border-radius: 8px; color: #3a3a3a; font-size: 13px; font-family: 'DM Sans', sans-serif;
      font-weight: 300; cursor: pointer; transition: all 0.15s;
    }
    .add-link-btn:hover { border-color: #333; color: #555; }
    .change-pw-toggle { font-family: 'DM Mono', monospace; font-size: 10px; color: #3a3a3a; cursor: pointer; letter-spacing: 0.05em; background: none; border: none; padding: 0; transition: color 0.15s; }
    .change-pw-toggle:hover { color: #666; }
    #pw-change-fields { display: none; margin-top: 14px; }
    .spinner { display: inline-block; width: 10px; height: 10px; border: 1.5px solid #333; border-top-color: #888; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Login -->
  <div id="login-screen">
    <div class="login-box">
      <div class="login-title">dashboard — sign in</div>
      <div class="field">
        <div class="field-label">password</div>
        <input type="password" id="pw-input" placeholder="enter password" autocomplete="current-password" />
      </div>
      <div class="error-msg" id="error-msg">incorrect password</div>
      <button class="btn btn-primary" onclick="tryLogin()">sign in</button>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard-screen">
    <div class="topbar">
      <div class="topbar-title">dashboard</div>
      <div class="topbar-actions">
        <span class="save-flash" id="save-flash">saved ✓</span>
        <span id="save-spinner" style="display:none"><span class="spinner"></span></span>
        <a class="btn-sm" href="index.html" target="_blank">view profile ↗</a>
        <button class="btn-sm btn-save" onclick="saveAll()">save changes</button>
      </div>
    </div>

    <div class="dashboard-body">

      <div class="section">
        <div class="section-title">profile</div>
        <div class="avatar-row">
          <div class="avatar-preview" id="dash-avatar-preview">
            <img id="dash-avatar-img" alt="avatar" />
            <span id="dash-avatar-initials">?</span>
          </div>
          <div>
            <div class="upload-btn" onclick="document.getElementById('dash-avatar-upload').click()">upload photo</div>
            <input type="file" id="dash-avatar-upload" accept="image/*" style="display:none" />
            <div style="font-size:11px;color:#333;margin-top:6px;font-family:'DM Mono',monospace;">square, min 200×200px recommended</div>
          </div>
        </div>
        <div class="two-col">
          <div class="field">
            <div class="field-label">name</div>
            <input type="text" id="d-name" placeholder="your name" />
          </div>
          <div class="field">
            <div class="field-label">handle</div>
            <input type="text" id="d-handle" placeholder="@handle" />
          </div>
        </div>
        <div class="field">
          <div class="field-label">bio</div>
          <textarea id="d-bio" placeholder="a short bio..."></textarea>
        </div>
      </div>

      <div class="section">
        <div class="section-title">banner</div>
        <div class="avatar-row">
          <div style="width:80px;height:44px;border-radius:6px;background:#161616;border:0.5px solid #222;overflow:hidden;flex-shrink:0;">
            <div id="banner-thumb-pattern" style="width:100%;height:100%;background-image:radial-gradient(circle at 1px 1px,#2a2a2a 1px,transparent 0);background-size:12px 12px;opacity:0.6;"></div>
            <img id="banner-thumb-img" style="width:100%;height:100%;object-fit:cover;display:none;" alt="banner" />
          </div>
          <div>
            <div class="upload-btn" onclick="document.getElementById('dash-banner-upload').click()">upload banner image</div>
            <input type="file" id="dash-banner-upload" accept="image/*" style="display:none" />
            <div style="font-size:11px;color:#333;margin-top:6px;font-family:'DM Mono',monospace;">840×220px or wider recommended</div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">links</div>
        <div style="display:grid;grid-template-columns:1fr 2fr 24px;gap:8px;margin-bottom:6px;padding:0 10px;">
          <span style="font-family:'DM Mono',monospace;font-size:10px;color:#333;letter-spacing:0.05em;">label</span>
          <span style="font-family:'DM Mono',monospace;font-size:10px;color:#333;letter-spacing:0.05em;">url</span>
        </div>
        <div class="links-list" id="dash-links"></div>
        <button class="add-link-btn" onclick="addLinkRow()">+ add link</button>
      </div>

      <div class="section">
        <div class="section-title">security</div>
        <button class="change-pw-toggle" onclick="togglePwChange()">change password</button>
        <div id="pw-change-fields">
          <div class="field" style="margin-top:14px;">
            <div class="field-label">current password</div>
            <input type="password" id="pw-current" placeholder="current password" />
          </div>
          <div class="field">
            <div class="field-label">new password</div>
            <input type="password" id="pw-new" placeholder="new password" />
          </div>
          <div class="field">
            <div class="field-label">confirm new password</div>
            <input type="password" id="pw-confirm" placeholder="confirm new password" />
          </div>
          <button class="btn" onclick="changePassword()" style="width:auto;padding:8px 20px;">update password</button>
          <span id="pw-msg" style="font-family:'DM Mono',monospace;font-size:11px;margin-left:12px;"></span>
        </div>
      </div>

      <div class="section">
        <div class="section-title">session</div>
        <button class="btn-sm" onclick="logout()">sign out</button>
      </div>

    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://hkuhtqgpifwxfigpfofk.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrdWh0cWdwaWZ3eGZpZ3Bmb2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3Njg3NjMsImV4cCI6MjA5MzM0NDc2M30.3A6ed9unJFuffExaOeXMJ75dcUj9SH7gQ5A_fXKQp_U';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const DEFAULT_PW = 'hi';
    function getPassword() { return localStorage.getItem('dash_password') || DEFAULT_PW; }

    function tryLogin() {
      const val = document.getElementById('pw-input').value;
      if (val === getPassword()) {
        sessionStorage.setItem('dash_auth', '1');
        showDashboard();
      } else {
        document.getElementById('error-msg').style.display = 'block';
        document.getElementById('pw-input').style.borderColor = '#5a2a2a';
      }
    }

    document.getElementById('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

    function logout() { sessionStorage.removeItem('dash_auth'); location.reload(); }

    function showDashboard() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard-screen').style.display = 'block';
      loadDashboard();
    }

    if (sessionStorage.getItem('dash_auth') === '1') showDashboard();

    async function loadDashboard() {
      const { data, error } = await sb.from('profile').select('*').eq('id', 'main').single();
      if (error || !data) { console.error(error); return; }

      document.getElementById('d-name').value = data.name || '';
      document.getElementById('d-handle').value = data.handle || '';
      document.getElementById('d-bio').value = data.bio || '';
      updateAvatarInitials(data.name || '');

      if (data.avatar) {
        document.getElementById('dash-avatar-img').src = data.avatar;
        document.getElementById('dash-avatar-img').style.display = 'block';
        document.getElementById('dash-avatar-initials').style.display = 'none';
      }
      if (data.banner) {
        document.getElementById('banner-thumb-img').src = data.banner;
        document.getElementById('banner-thumb-img').style.display = 'block';
        document.getElementById('banner-thumb-pattern').style.display = 'none';
      }

      const list = document.getElementById('dash-links');
      list.innerHTML = '';
      (Array.isArray(data.links) ? data.links : []).forEach(l => addLinkRow(l.label, l.url));
    }

    document.getElementById('d-name').addEventListener('input', function() { updateAvatarInitials(this.value); });

    function updateAvatarInitials(name) {
      const initials = name.trim().split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
      document.getElementById('dash-avatar-initials').textContent = initials || '?';
    }

    function toBase64(file) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = e => res(e.target.result);
        r.onerror = rej;
        r.readAsDataURL(file);
      });
    }

    document.getElementById('dash-avatar-upload').addEventListener('change', async function() {
      const file = this.files[0]; if (!file) return;
      const b64 = await toBase64(file);
      document.getElementById('dash-avatar-img').src = b64;
      document.getElementById('dash-avatar-img').style.display = 'block';
      document.getElementById('dash-avatar-initials').style.display = 'none';
      window._pendingAvatar = b64;
    });

    document.getElementById('dash-banner-upload').addEventListener('change', async function() {
      const file = this.files[0]; if (!file) return;
      const b64 = await toBase64(file);
      document.getElementById('banner-thumb-img').src = b64;
      document.getElementById('banner-thumb-img').style.display = 'block';
      document.getElementById('banner-thumb-pattern').style.display = 'none';
      window._pendingBanner = b64;
    });

    function addLinkRow(label = '', url = '') {
      const list = document.getElementById('dash-links');
      const row = document.createElement('div');
      row.className = 'link-row';
      row.innerHTML = `
        <span class="link-drag" title="drag to reorder">⠿</span>
        <input class="inp-label" type="text" placeholder="Label" value="${esc(label)}" />
        <input class="inp-url" type="text" placeholder="URL e.g. instagram.com/you" value="${esc(url)}" />
        <button class="link-del" onclick="this.closest('.link-row').remove()">×</button>
      `;
      list.appendChild(row);
    }

    function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    async function saveAll() {
      const spinner = document.getElementById('save-spinner');
      const flash = document.getElementById('save-flash');
      spinner.style.display = 'inline-block';

      const { data: current } = await sb.from('profile').select('avatar,banner,views').eq('id','main').single();

      const payload = {
        name: document.getElementById('d-name').value.trim(),
        handle: document.getElementById('d-handle').value.trim(),
        bio: document.getElementById('d-bio').value.trim(),
        avatar: window._pendingAvatar || (current && current.avatar) || '',
        banner: window._pendingBanner || (current && current.banner) || '',
        links: Array.from(document.querySelectorAll('#dash-links .link-row')).map(row => ({
          label: row.querySelector('.inp-label').value.trim(),
          url: row.querySelector('.inp-url').value.trim(),
        })).filter(l => l.url),
      };

      const { error } = await sb.from('profile').update(payload).eq('id', 'main');
      spinner.style.display = 'none';

      if (!error) {
        flash.classList.add('show');
        setTimeout(() => flash.classList.remove('show'), 2500);
      } else {
        alert('Save failed: ' + error.message);
      }
    }

    function togglePwChange() {
      const el = document.getElementById('pw-change-fields');
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    function changePassword() {
      const current = document.getElementById('pw-current').value;
      const next = document.getElementById('pw-new').value;
      const confirm = document.getElementById('pw-confirm').value;
      const msg = document.getElementById('pw-msg');
      if (current !== getPassword()) { msg.style.color='#7a3a3a'; msg.textContent='incorrect current password'; return; }
      if (!next) { msg.style.color='#7a3a3a'; msg.textContent='new password cannot be empty'; return; }
      if (next !== confirm) { msg.style.color='#7a3a3a'; msg.textContent='passwords do not match'; return; }
      localStorage.setItem('dash_password', next);
      msg.style.color='#3a5a3a'; msg.textContent='password updated';
      document.getElementById('pw-current').value = '';
      document.getElementById('pw-new').value = '';
      document.getElementById('pw-confirm').value = '';
    }
  </script>
</body>
</html>
