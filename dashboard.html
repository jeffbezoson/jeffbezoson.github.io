<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing:border-box; margin:0; padding:0; }

body {
  background:#0a0a0a;
  color:#e8e4de;
  font-family:'DM Sans',sans-serif;
}

/* LOGIN */
#login-screen {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.login-box {
  width:100%;
  max-width:340px;
  background:#111;
  border:1px solid #222;
  border-radius:16px;
  padding:32px;
}

input {
  width:100%;
  margin-bottom:10px;
  padding:10px;
  background:#161616;
  border:1px solid #222;
  color:#ccc;
}

button {
  width:100%;
  padding:10px;
  margin-top:10px;
  background:#e8e4de;
  border:none;
  cursor:pointer;
}

/* DASHBOARD */
#dashboard-screen { display:none; padding:30px; }

.section { margin-bottom:20px; }

.link-row {
  display:flex;
  gap:6px;
  margin-bottom:6px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h3 style="margin-bottom:15px;">Sign In</h3>

    <input id="email" placeholder="email">
    <input id="password" type="password" placeholder="password">

    <button onclick="signIn()">Sign In</button>
    <button onclick="signUp()">Create Account</button>

    <p id="error" style="color:#ff6b6b;margin-top:10px;"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard-screen">

  <h3 id="user-email" style="margin-bottom:20px;"></h3>

  <div class="section">
    <input id="name" placeholder="name">
    <input id="handle" placeholder="@handle">
    <input id="bio" placeholder="bio">
  </div>

  <div class="section">
    <h4>Links</h4>
    <div id="links"></div>
    <button onclick="addLink()">+ Add Link</button>
  </div>

  <div class="section">
    <button onclick="save()">Save</button>
    <button onclick="logout()">Logout</button>
  </div>

</div>

<script>
const supabase = window.supabase.createClient(
  "https://hkuhtqgpifwxfigpfofk.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrdWh0cWdwaWZ3eGZpZ3Bmb2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3Njg3NjMsImV4cCI6MjA5MzM0NDc2M30.3A6ed9unJFuffExaOeXMJ75dcUj9SH7gQ5A_fXKQp_U"
);

let user = null;
let links = [];

/* INIT */
init();
async function init() {
  document.getElementById("dashboard-screen").style.display = "none";

  const { data } = await supabase.auth.getUser();

  if (data.user) {
    user = data.user;
    showDashboard();
  }
}

/* AUTH */
async function signIn() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });

  if (error) return showError(error.message);

  user = data.user;
  showDashboard();
}

async function signUp() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { error } = await supabase.auth.signUp({ email, password });

  if (error) return showError(error.message);

  alert("Account created. Check email if confirmation is on.");
}

async function logout() {
  await supabase.auth.signOut();
  location.reload();
}

/* UI */
function showError(msg) {
  document.getElementById("error").textContent = msg;
}

function showDashboard() {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("dashboard-screen").style.display = "block";
  document.getElementById("user-email").textContent = user.email;
  loadProfile();
}

/* PROFILE */
async function loadProfile() {
  const { data } = await supabase
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .single();

  if (!data) return;

  document.getElementById("name").value = data.name || "";
  document.getElementById("handle").value = data.handle || "";
  document.getElementById("bio").value = data.bio || "";

  links = data.links || [];
  renderLinks();
}

async function save() {
  const profile = {
    id: user.id,
    name: document.getElementById("name").value,
    handle: document.getElementById("handle").value,
    bio: document.getElementById("bio").value,
    links: links
  };

  const { error } = await supabase.from("profiles").upsert(profile);

  if (error) return alert(error.message);

  alert("Saved ✅");
}

/* LINKS */
function renderLinks() {
  const container = document.getElementById("links");
  container.innerHTML = "";

  links.forEach((l, i) => {
    const div = document.createElement("div");
    div.className = "link-row";

    div.innerHTML = `
      <input value="${l.label}" onchange="links[${i}].label=this.value">
      <input value="${l.url}" onchange="links[${i}].url=this.value">
      <button onclick="removeLink(${i})">x</button>
    `;

    container.appendChild(div);
  });
}

function addLink() {
  links.push({ label:"", url:"" });
  renderLinks();
}

function removeLink(i) {
  links.splice(i,1);
  renderLinks();
}
</script>

</body>
</html>
