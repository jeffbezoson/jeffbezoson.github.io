<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      color: #e8e4de;
      padding: 2rem;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #111;
      border: 0.5px solid #222;
      border-radius: 16px;
      overflow: visible;
      position: relative;
    }
    .banner {
      width: 100%;
      height: 110px;
      background: #161616;
      position: relative;
      overflow: hidden;
      border-radius: 16px 16px 0 0;
    }
    .banner-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
    .banner-pattern {
      position: absolute; inset: 0;
      background-image: radial-gradient(circle at 1px 1px, #2a2a2a 1px, transparent 0);
      background-size: 24px 24px; opacity: 0.6;
    }
    .avatar-wrap { position: absolute; top: -36px; left: 28px; z-index: 10; }
    .avatar {
      width: 72px; height: 72px; border-radius: 50%;
      background: #1e1e1e; border: 3px solid #111;
      display: flex; align-items: center; justify-content: center;
      font-family: 'DM Mono', monospace; font-size: 22px;
      color: #888; font-weight: 300; overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .body { padding: 52px 28px 28px; position: relative; }
    .name-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
    .name { font-size: 20px; font-weight: 500; color: #f0ece6; letter-spacing: -0.3px; }
    .handle { font-family: 'DM Mono', monospace; font-size: 12px; color: #555; font-weight: 300; }
    .bio { font-size: 13px; color: #666; line-height: 1.6; margin: 10px 0 20px; font-weight: 300; min-height: 20px; }
    .divider { height: 0.5px; background: #1e1e1e; margin: 20px 0; }
    .links-label { font-family: 'DM Mono', monospace; font-size: 10px; color: #444; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 12px; }
    .links { display: flex; flex-direction: column; gap: 8px; }
    .link-item {
      display: flex; align-items: center; gap: 10px; padding: 9px 12px;
      background: #161616; border: 0.5px solid #1e1e1e; border-radius: 8px;
      transition: background 0.15s, border-color 0.15s;
      color: inherit; text-decoration: none;
    }
    .link-item:hover { background: #1a1a1a; border-color: #2a2a2a; }
    .link-icon { width: 18px; height: 18px; flex-shrink: 0; color: #555; }
    .link-label { font-size: 13px; color: #999; font-weight: 300; flex: 1; }
    .stats { display: flex; gap: 20px; margin-top: 20px; }
    .stat { display: flex; flex-direction: column; gap: 2px; }
    .stat-num { font-family: 'DM Mono', monospace; font-size: 16px; color: #ccc; font-weight: 300; }
    .stat-label { font-size: 11px; color: #444; font-weight: 300; }
    .edit-btn {
      position: fixed; bottom: 24px; right: 24px;
      background: #1a1a1a; border: 0.5px solid #2a2a2a;
      border-radius: 8px; color: #555;
      font-family: 'DM Mono', monospace; font-size: 11px;
      padding: 8px 14px; cursor: pointer;
      text-decoration: none; transition: color 0.15s, border-color 0.15s;
    }
    .edit-btn:hover { color: #999; border-color: #444; }
  </style>
</head>
<body>
  <div class="card">
    <div class="banner">
      <div class="banner-bg" id="banner-bg"></div>
      <div class="banner-pattern" id="banner-pattern"></div>
    </div>
    <div class="body">
      <div class="avatar-wrap">
        <div class="avatar">
          <img id="avatar-img" alt="avatar" />
          <span id="avatar-initials">...</span>
        </div>
      </div>
      <div class="name-row">
        <div class="name" id="name-el">&nbsp;</div>
        <div class="handle" id="handle-el"></div>
      </div>
      <div class="bio" id="bio-el"></div>
      <div class="divider"></div>
      <div class="links-label">links</div>
      <div class="links" id="links-container">
        <div style="font-family:'DM Mono',monospace;font-size:11px;color:#333;padding:8px 0;">loading...</div>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="stat-num" id="views-count">—</span>
          <span class="stat-label">profile views</span>
        </div>
        <div class="stat">
          <span class="stat-num" id="links-count">—</span>
          <span class="stat-label">links</span>
        </div>
      </div>
    </div>
  </div>
  <script>
    const SUPABASE_URL = 'https://hkuhtqgpifwxfigpfofk.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrdWh0cWdwaWZ3eGZpZ3Bmb2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3Njg3NjMsImV4cCI6MjA5MzM0NDc2M30.3A6ed9unJFuffExaOeXMJ75dcUj9SH7gQ5A_fXKQp_U';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const icons = {
      gh: `<svg class="link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>`,
      tw: `<svg class="link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"/></svg>`,
      ig: `<svg class="link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"/></svg>`,
      tt: `<svg class="link-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.3 6.3 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.75a4.85 4.85 0 0 1-1.01-.06z"/></svg>`,
      rb: `<svg class="link-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5.25L6.75 19.5l14.25-4.5L17.25 0.75zm5.4 5.55l5.55-1.65 1.05 3.9-5.55 1.65z"/></svg>`,
      link: `<svg class="link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`,
    };

    function getIcon(url) {
      const l = (url || '').toLowerCase();
      if (l.includes('github')) return icons.gh;
      if (l.includes('twitter') || l.includes('x.com')) return icons.tw;
      if (l.includes('instagram')) return icons.ig;
      if (l.includes('tiktok')) return icons.tt;
      if (l.includes('roblox')) return icons.rb;
      return icons.link;
    }

    async function load() {
      const { data, error } = await sb.from('profile').select('*').eq('id', 'main').single();
      if (error || !data) { console.error(error); return; }

      document.title = data.name || 'Profile';
      document.getElementById('name-el').textContent = data.name || '';
      document.getElementById('handle-el').textContent = data.handle || '';
      document.getElementById('bio-el').textContent = data.bio || '';

      if (data.avatar) {
        const img = document.getElementById('avatar-img');
        img.src = data.avatar;
        img.style.display = 'block';
        document.getElementById('avatar-initials').style.display = 'none';
      } else {
        const initials = (data.name || '').trim().split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
        document.getElementById('avatar-initials').textContent = initials || '?';
      }

      if (data.banner) {
        document.getElementById('banner-bg').style.backgroundImage = `url(${data.banner})`;
        document.getElementById('banner-pattern').style.display = 'none';
      }

      const links = Array.isArray(data.links) ? data.links : [];
      const container = document.getElementById('links-container');
      container.innerHTML = '';
      links.forEach(link => {
        if (!link.url) return;
        const href = link.url.startsWith('http') ? link.url : 'https://' + link.url;
        const a = document.createElement('a');
        a.className = 'link-item';
        a.href = href;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.innerHTML = `${getIcon(link.url)}<span class="link-label">${link.label || link.url}</span>`;
        container.appendChild(a);
      });
      document.getElementById('links-count').textContent = links.length;

      const newViews = (data.views || 0) + 1;
      document.getElementById('views-count').textContent = newViews;
      await sb.from('profile').update({ views: newViews }).eq('id', 'main');
    }

    load();
  </script>
</body>
</html>
