<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      color: #e8e4de;
      padding: 2rem;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #111;
      border: 0.5px solid #222;
      border-radius: 16px;
      overflow: visible;
      position: relative;
    }
    .banner {
      width: 100%;
      height: 110px;
      background: #161616;
      position: relative;
      overflow: hidden;
      border-radius: 16px 16px 0 0;
    }
    .banner-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
    }
    .banner-pattern {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle at 1px 1px, #2a2a2a 1px, transparent 0);
      background-size: 24px 24px;
      opacity: 0.6;
    }
    .avatar-wrap {
      position: absolute;
      top: -36px;
      left: 28px;
      z-index: 10;
    }
    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #1e1e1e;
      border: 3px solid #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Mono', monospace;
      font-size: 22px;
      color: #888;
      font-weight: 300;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .body { padding: 52px 28px 28px; position: relative; }
    .name-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
    .name { font-size: 20px; font-weight: 500; color: #f0ece6; letter-spacing: -0.3px; }
    .handle { font-family: 'DM Mono', monospace; font-size: 12px; color: #555; font-weight: 300; }
    .bio { font-size: 13px; color: #666; line-height: 1.6; margin: 10px 0 20px; font-weight: 300; min-height: 20px; }
    .divider { height: 0.5px; background: #1e1e1e; margin: 20px 0; }
    .links-label { font-family: 'DM Mono', monospace; font-size: 10px; color: #444; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 12px; }
    .links { display: flex; flex-direction: column; gap: 8px; }
    .link-item {
      display: flex; align-items: center; gap: 10px; padding: 9px 12px;
      background: #161616; border: 0.5px solid #1e1e1e; border-radius: 8px;
      transition: background 0.15s, border-color 0.15s;
      color: inherit; text-decoration: none;
    }
    .link-item:hover { background: #1a1a1a; border-color: #2a2a2a; }
    .link-icon { width: 18px; height: 18px; flex-shrink: 0; color: #555; }
    .link-label { font-size: 13px; color: #999; font-weight: 300; flex: 1; }
    .stats { display: flex; gap: 20px; margin-top: 20px; }
    .stat { display: flex; flex-direction: column; gap: 2px; }
    .stat-num { font-family: 'DM Mono', monospace; font-size: 16px; color: #ccc; font-weight: 300; }
    .stat-label { font-size: 11px; color: #444; font-weight: 300; }
    .edit-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1a1a1a;
      border: 0.5px solid #2a2a2a;
      border-radius: 8px;
      color: #555;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      padding: 8px 14px;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.15s, border-color 0.15s;
    }
    .edit-btn:hover { color: #999; border-color: #444; }
  </style>
</head>
<body>
  <div class="card">
    <div class="banner">
      <div class="banner-bg" id="banner-bg"></div>
      <div class="banner-pattern" id="banner-pattern"></div>
    </div>
    <div class="body">
      <div class="avatar-wrap">
        <div class="avatar" id="avatar">
          <img id="avatar-img" alt="avatar" />
          <span id="avatar-initials">?</span>
        </div>
      </div>
      <div class="name-row">
        <div class="name" id="name-el"></div>
        <div class="handle" id="handle-el"></div>
      </div>
      <div class="bio" id="bio-el"></div>
      <div class="divider"></div>
      <div class="links-label">links</div>
      <div class="links" id="links-container"></div>
      <div class="stats">
        <div class="stat">
          <span class="stat-num" id="views-count">0</span>
          <span class="stat-label">profile views</span>
        </div>
        <div class="stat">
          <span class="stat-num" id="links-count">0</span>
          <span class="stat-label">links</span>
        </div>
      </div>
    </div>
  </div>
  <a class="edit-btn" href="dashboard.html">edit profile</a>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabase = window.supabase.createClient(
  "https://hkuhtqgpifwxfigpfofk.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
);

async function load() {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) return;

  const { data } = await supabase
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .single();

  if (!data) return;

  document.getElementById("name-el").textContent = data.name;
  document.getElementById("handle-el").textContent = data.handle;
  document.getElementById("bio-el").textContent = data.bio;

  const container = document.getElementById("links-container");
  container.innerHTML = "";

  (data.links || []).forEach(link => {
    const a = document.createElement("a");
    a.href = link.url.startsWith("http") ? link.url : "https://" + link.url;
    a.target = "_blank";
    a.textContent = link.label;
    container.appendChild(a);
  });
}

load();
</script>
</body>
</html>
